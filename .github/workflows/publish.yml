name: Publish All Packages

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: 'Release type (patch/minor/major)'
        type: choice
        options:
          - major
          - patch
          - minor
        default: 'patch'
        required: true
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Gate the release on the same cross-language validation the single-language
  # publish workflows run, so a broken tree is never tagged or published.
  validate:
    uses: ./.github/workflows/cross-language-validate.yml

  bump_and_tag:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    needs:
      - validate
    runs-on: ubuntu-latest
    permissions:
      contents: write

    outputs:
      version: ${{ steps.version.outputs.version }}
      release_notes: ${{ steps.notes.outputs.release_notes }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.x'

      - name: Setup uv
        uses: astral-sh/setup-uv@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: packages/ballast-go/go.mod

      - name: Get Previous tag
        id: previoustag
        uses: WyriHaximus/github-action-get-previous-tag@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Get next version
        id: semvers
        uses: WyriHaximus/github-action-next-semvers@v1
        with:
          version: ${{ steps.previoustag.outputs.tag }}

      - name: Set version
        id: version
        run: |
          if [ "${{ github.event.inputs.release_type }}" = "major" ]; then
            echo "version=${{ steps.semvers.outputs.major }}" >> $GITHUB_OUTPUT
          elif [ "${{ github.event.inputs.release_type }}" = "minor" ]; then
            echo "version=${{ steps.semvers.outputs.minor }}" >> $GITHUB_OUTPUT
          else
            echo "version=${{ steps.semvers.outputs.patch }}" >> $GITHUB_OUTPUT
          fi

      - name: Bump TypeScript package version
        run: |
          set -euo pipefail
          npm --prefix packages/ballast-typescript version "${{ steps.version.outputs.version }}" --no-git-tag-version

      - name: Bump Python package version
        run: |
          set -euo pipefail
          uv version --directory packages/ballast-python "${{ steps.version.outputs.version }}" --frozen
          uv lock --directory packages/ballast-python

      # Managed rule/skill outputs carry the version of the Ballast that wrote
      # them. Without this the release ships outputs stamped with the previous
      # version, and the gap widens every release. A source-built wrapper is a
      # dev build, so it installs backends from this tree -- which is the only
      # way to regenerate at a version that has not been published yet.
      - name: Setup pnpm
        uses: pnpm/action-setup@v6.1.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Regenerate managed agent outputs at the release version
        run: |
          set -euo pipefail
          pnpm run build
          # The wrapper resolves every backend from this source tree. The Go
          # backend binary is gitignored and no other step produces it, so
          # without this build `upgrade` falls through to a $PATH lookup for
          # ballast-go that cannot succeed on a clean checkout. build-go
          # stamps the bumped version, keeping the rules it emits in step with
          # the TypeScript and Python backends.
          make build-go
          mkdir -p .ci/bin
          go build -C cli/ballast -o "${PWD}/.ci/bin/ballast" .
          .ci/bin/ballast upgrade --patch

      # Rule markers record which version generated that content, so a rule
      # whose body did not change keeps its older stamp -- patch mode
      # deliberately leaves pristine files alone. Requiring every marker to
      # equal the release version would fail every release. What must hold is
      # that the config records this release and that nothing claims a version
      # newer than it, which would mean a stale or hand-edited artifact.
      - name: Verify regenerated outputs record the release version
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          grep -q "\"ballastVersion\": \"${VERSION}\"" .rulesrc.json
          NEWER="$(grep -rho 'version="[^"]*"' .claude/rules .codex/rules \
            --include='*.md' | sort -u | sed 's/version="//; s/"$//' \
            | while read -r marker; do
                [ "${marker}" = "${VERSION}" ] && continue
                if [ "$(printf '%s\n%s\n' "${VERSION}" "${marker}" | sort -V | tail -1)" = "${marker}" ]; then
                  echo "${marker}"
                fi
              done)"
          if [ -n "${NEWER}" ]; then
            echo "Rules claim versions newer than ${VERSION}:" >&2
            echo "${NEWER}" >&2
            exit 1
          fi

      # castoff reads `git describe --tags --abbrev=0 HEAD^` and logs from there
      # to HEAD, so it runs before the release commit is made and the tag is
      # created. OPENAI_API_KEY is an organization secret, so a missing key
      # means misconfiguration, not an opt-out: fail here rather than tag a
      # release whose changelog and release notes were quietly skipped.
      # Scoped to this step so the key is never exported to the whole job,
      # where dependency installs, builds and every third-party action would
      # inherit it.
      - name: Require OpenAI API key
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${OPENAI_API_KEY//[[:space:]]/}" ]; then
            echo "::error::OPENAI_API_KEY is not available to this repository. Grant the organization secret to everydaydevopsio/ballast." >&2
            exit 1
          fi

      - name: Generate AI release notes
        id: notes
        uses: everydaydevopsio/castoff/castoff@v2
        env:
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
        with:
          openai_api_key: ${{ secrets.OPENAI_API_KEY }}
          tag: v${{ steps.version.outputs.version }}

      # No guard on changelog_entry: the action rejects an empty entry, which
      # is the signal that castoff produced nothing usable.
      - name: Update CHANGELOG.md
        id: changelog
        uses: everydaydevopsio/castoff/changelog@v2
        with:
          version: ${{ steps.version.outputs.version }}
          entry: ${{ steps.notes.outputs.changelog_entry }}

      - name: Commit and create tag
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          rm -rf .ci
          git add packages/ballast-typescript/package.json packages/ballast-python/pyproject.toml packages/ballast-python/uv.lock
          git add .rulesrc.json .claude .codex AGENTS.md CLAUDE.md
          git add CHANGELOG.md
          git commit -m "chore(release): bump version to ${VERSION} [skip ci]"

          git tag "v${VERSION}"

      - name: Push commit and tag
        run: |
          set -euo pipefail
          git push origin HEAD:${{ github.ref_name }}
          git push origin "v${{ steps.version.outputs.version }}"

  publish_typescript:
    if: ${{ always() && needs.validate.result == 'success' && ((github.event_name == 'workflow_dispatch' && needs.bump_and_tag.result == 'success') || (github.event_name == 'push' && github.actor != 'github-actions[bot]')) }}
    needs:
      - validate
      - bump_and_tag
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/v{0}', needs.bump_and_tag.outputs.version) || github.ref }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.x'
          registry-url: 'https://registry.npmjs.org'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm --filter @everydaydevopsio/ballast run test

      - name: Publish to npm
        working-directory: packages/ballast-typescript
        run: npm publish --access public --provenance

  publish_python:
    if: ${{ always() && needs.validate.result == 'success' && ((github.event_name == 'workflow_dispatch' && needs.bump_and_tag.result == 'success') || (github.event_name == 'push' && github.actor != 'github-actions[bot]')) }}
    needs:
      - validate
      - bump_and_tag
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/v{0}', needs.bump_and_tag.outputs.version) || github.ref }}

      - name: Setup uv
        uses: astral-sh/setup-uv@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Build package
        run: env UV_CACHE_DIR=/tmp/uv-cache uv build packages/ballast-python --sdist --wheel

      - name: Publish Python artifacts to GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', needs.bump_and_tag.outputs.version) || github.ref_name }}
          RELEASE_NAME: ${{ github.event_name == 'workflow_dispatch' && format('ballast-python v{0}', needs.bump_and_tag.outputs.version) || format('ballast-python {0}', github.ref_name) }}
        run: |
          scripts/upload-github-release-assets.sh "$RELEASE_TAG" "$RELEASE_NAME" \
            packages/ballast-python/dist/*.whl \
            packages/ballast-python/dist/*.tar.gz

  publish_go:
    if: ${{ always() && needs.validate.result == 'success' && ((github.event_name == 'workflow_dispatch' && needs.bump_and_tag.result == 'success') || (github.event_name == 'push' && github.actor != 'github-actions[bot]')) }}
    needs:
      - validate
      - bump_and_tag
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/v{0}', needs.bump_and_tag.outputs.version) || github.ref }}
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26.x'
          cache-dependency-path: packages/ballast-go/go.mod

      - name: Verify build
        run: |
          cd packages/ballast-go
          go build -o /tmp/ballast-go-verify ./cmd/ballast-go

      # GoReleaser writes the GitHub Release body. Hand it the castoff notes
      # when they exist; fall back to GoReleaser's own changelog otherwise, so
      # tag-triggered runs (where bump_and_tag is skipped) still publish.
      - name: Prepare release notes
        id: release_notes
        env:
          NOTES: ${{ needs.bump_and_tag.outputs.release_notes }}
        run: |
          set -euo pipefail
          if [ -n "${NOTES}" ]; then
            printf '%s\n' "${NOTES}" > "${RUNNER_TEMP}/release-notes.md"
            echo "args=--release-notes=${RUNNER_TEMP}/release-notes.md" >> "$GITHUB_OUTPUT"
          else
            echo "args=" >> "$GITHUB_OUTPUT"
          fi

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: 'v2.14.0'
          workdir: packages/ballast-go
          args: release --clean --config .goreleaser.yaml ${{ steps.release_notes.outputs.args }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish_cli:
    if: ${{ always() && needs.validate.result == 'success' && ((github.event_name == 'workflow_dispatch' && needs.bump_and_tag.result == 'success') || (github.event_name == 'push' && github.actor != 'github-actions[bot]')) }}
    needs:
      - validate
      - bump_and_tag
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/v{0}', needs.bump_and_tag.outputs.version) || github.ref }}
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26.x'
          cache-dependency-path: cli/ballast/go.mod

      - name: Import Developer ID certificate
        uses: apple-actions/import-codesign-certs@v7
        with:
          p12-file-base64: ${{ secrets.APPLE_CERTIFICATE }}
          p12-password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}

      - name: Set up App Store Connect API key
        run: |
          mkdir -p ~/.private_keys
          printf '%s' "$APPLE_API_KEY_CONTENT" | base64 -D \
            > ~/.private_keys/AuthKey_${APPLE_API_KEY_ID}.p8
          chmod 600 ~/.private_keys/AuthKey_${APPLE_API_KEY_ID}.p8
        env:
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY_CONTENT }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}

      - name: Verify build
        run: |
          cd cli/ballast
          go build -o /tmp/ballast-verify .

      # GoReleaser writes the GitHub Release body. Hand it the castoff notes
      # when they exist; fall back to GoReleaser's own changelog otherwise, so
      # tag-triggered runs (where bump_and_tag is skipped) still publish.
      - name: Prepare release notes
        id: release_notes
        env:
          NOTES: ${{ needs.bump_and_tag.outputs.release_notes }}
        run: |
          set -euo pipefail
          if [ -n "${NOTES}" ]; then
            printf '%s\n' "${NOTES}" > "${RUNNER_TEMP}/release-notes.md"
            echo "args=--release-notes=${RUNNER_TEMP}/release-notes.md" >> "$GITHUB_OUTPUT"
          else
            echo "args=" >> "$GITHUB_OUTPUT"
          fi

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: 'v2.14.0'
          args: release --clean --config cli/ballast/.goreleaser.yaml ${{ steps.release_notes.outputs.args }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}

      - name: Notarize darwin release archives
        run: |
          VERSION="${{ needs.bump_and_tag.outputs.version || github.ref_name }}"
          VERSION="${VERSION#v}"
          for ARCH in amd64 arm64; do
            ARCHIVE="dist/ballast_${VERSION}_darwin_${ARCH}.tar.gz"
            WORKDIR="/tmp/notarize_${ARCH}"
            mkdir -p "$WORKDIR"

            tar -xzf "$ARCHIVE" -C "$WORKDIR" ballast
            ditto -c -k --keepParent "$WORKDIR/ballast" "$WORKDIR/ballast.zip"

            xcrun notarytool submit "$WORKDIR/ballast.zip" \
              --key ~/.private_keys/AuthKey_${APPLE_API_KEY_ID}.p8 \
              --key-id "$APPLE_API_KEY_ID" \
              --issuer "$APPLE_API_KEY_ISSUER_ID" \
              --wait \
              --timeout 20m

            echo "Notarized darwin/${ARCH}"
          done
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_KEY_ISSUER_ID: ${{ secrets.APPLE_API_KEY_ISSUER_ID }}
