replicaCount: 1

image:
  repository: ghcr.io/everydaydevopsio/ballast-telemetry-aggregator
  tag: latest
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8080

storage:
  backend: local
  local:
    enabled: true
    mountPath: /data
    size: 1Gi
    storageClassName: ""
  s3:
    bucket: ""
    prefix: ballast/telemetry
    region: ""

existingSecret: ""
tokenSecretKey: token

resources: {}

podAnnotations: {}
podLabels: {}

nodeSelector: {}
tolerations: []
affinity: {}
