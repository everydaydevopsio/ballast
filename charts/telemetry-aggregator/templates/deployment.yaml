{{ include "ballast.telemetry.validate" . }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-telemetry
  labels:
    app.kubernetes.io/name: ballast-telemetry-aggregator
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: ballast-telemetry-aggregator
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ballast-telemetry-aggregator
        app.kubernetes.io/instance: {{ .Release.Name }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      containers:
        - name: telemetry-aggregator
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: BALLAST_TELEMETRY_STORAGE
              value: {{ .Values.storage.backend | quote }}
            - name: BALLAST_TELEMETRY_LOCAL_PATH
              value: {{ printf "%s/telemetry.jsonl" .Values.storage.local.mountPath | quote }}
            - name: BALLAST_TELEMETRY_S3_BUCKET
              value: {{ .Values.storage.s3.bucket | quote }}
            - name: BALLAST_TELEMETRY_S3_PREFIX
              value: {{ .Values.storage.s3.prefix | quote }}
            {{- if .Values.storage.s3.region }}
            - name: AWS_REGION
              value: {{ .Values.storage.s3.region | quote }}
            {{- end }}
            {{- if .Values.existingSecret }}
            - name: BALLAST_TELEMETRY_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret | quote }}
                  key: {{ .Values.tokenSecretKey | quote }}
            {{- end }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          {{- if eq .Values.storage.backend "local" }}
          volumeMounts:
            - name: data
              mountPath: {{ .Values.storage.local.mountPath }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- if eq .Values.storage.backend "local" }}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-telemetry
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
